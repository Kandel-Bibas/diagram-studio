<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagram Studio</title>
<style id="tokens">
/* Bibas — design tokens (Ramp-inspired editorial monochrome + one highlighter accent).
   Canonical source. Copy this block into a project's global stylesheet (or a document's
   <style> tag) and build on the tokens — never hard-code a colour, radius, or font in a
   component rule. Rules for using them: ~/.agents/design-system.md
   Every colour is defined once with light-dark(); a theme toggle only flips color-scheme. */
:root {
  color-scheme: light dark;

  /* surfaces */
  --page:        light-dark(#f4f2f0, #0f0e0d);   /* Bone canvas | below Obsidian */
  --surface:     light-dark(#ffffff, #1a1919);   /* Paper cards | Obsidian */
  --fill:        light-dark(#f4f2f0, #262524);   /* Wash: callouts, hovers, table heads */
  --inverse:     #1a1919;                        /* Obsidian: the one inverted panel, code blocks */
  --on-inverse:  #f4f2f0;

  /* lines — elevation is a hairline, never a shadow */
  --line:        light-dark(#e5e7eb, #2e2d2c);   /* Hairline */
  --line-strong: light-dark(#d3d3d3, #474543);   /* Smoke: inputs, stronger dividers */

  /* text */
  --ink:         light-dark(#0c0a08, #f4f2f0);   /* headings, values, emphasis */
  --ink-2:       light-dark(#3b3937, #c9c6c2);   /* body copy */
  --ink-3:       light-dark(#6d6c6b, #969390);   /* Ash: labels, captions, meta */

  /* the one chromatic accent — identical in both themes. A FILL for action and live state.
     Never text on a light surface (contrast), never a wash or decoration. */
  --accent:      #e4f222;
  --on-accent:   #0c0a08;

  /* functional colours — encode meaning only (pass/fail, diff add/remove, errors). Not accents. */
  --good:        light-dark(#1f6f47, #7ad3a3);
  --good-fill:   light-dark(#e9f4ee, #16291f);
  --warn:        light-dark(#8a5a00, #eec268);
  --warn-fill:   light-dark(#f8f0de, #2e2514);
  --bad:         light-dark(#a32018, #ff8f85);
  --bad-fill:    light-dark(#fbeceb, #351c1a);

  /* type — one family, one weight. Hierarchy comes from size and ink colour, never bold. */
  --sans: "Lausanne", "Inter", "Söhne", "Helvetica Neue", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --weight: 400;
  --text-caption: 13px;     --leading-caption: 1.45;
  --text-small: 14px;       --leading-small: 1.5;
  --text-body: 16px;        --leading-body: 1.5;
  --text-subheading: 20px;  --leading-subheading: 1.3;
  --text-heading-sm: 24px;  --leading-heading-sm: 1.17;
  --text-heading: 28px;     --leading-heading: 1.14;
  --text-heading-lg: 40px;  --leading-heading-lg: 1.05;
  --text-display: 64px;     --leading-display: 1;
  --tracking-display: -0.02em;   /* display and large headings only; body is 0 */

  /* spacing — 4px base */
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px;
  --s-6: 40px; --s-7: 64px; --s-8: 128px;

  /* radii — only these four */
  --r-control: 6px;   /* buttons, tags, steps */
  --r-input: 10px;    /* inputs, alerts */
  --r-wash: 12px;     /* wash cards, callouts, inner panels */
  --r-card: 16px;     /* content cards */

  --control-h: 44px;
  --page-max: 1200px;
  --ease: 0.3s ease-out;   /* colour / background / border only — no transform theatrics */
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"]  { color-scheme: dark; }

</style>
<style>
/* studio.css — app chrome and shared components. Tokens come from vendor/tokens.css; no raw colours here. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--page); color: var(--ink-2);
  font: var(--weight) var(--text-body)/var(--leading-body) var(--sans);
  display: flex; flex-direction: column; min-height: 100vh;
}
h1, h2, h3, h4 { font-weight: var(--weight); color: var(--ink); margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; font-weight: var(--weight); }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---- top bar ---- */
.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-2) var(--s-4);
  padding: var(--s-3) var(--s-5); background: var(--surface); border-bottom: 1px solid var(--line);
}
.app-name { font-size: var(--text-subheading); line-height: var(--leading-subheading); margin-right: var(--s-2); }
.bar-group { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-1); }
.bar-spacer { flex: 1; }
.zoom-level { min-width: 4.5ch; text-align: center; font-size: var(--text-small); color: var(--ink-3); font-variant-numeric: tabular-nums; }

/* ---- buttons (design-system components) ---- */
.btn {
  height: var(--control-h); padding: 0 var(--s-4); border-radius: var(--r-control); border: 1px solid transparent;
  background: transparent; cursor: pointer; white-space: nowrap;
  transition: background var(--ease), color var(--ease), border-color var(--ease);
}
.btn:disabled { color: var(--ink-3); cursor: default; }
.btn-primary { background: var(--accent); color: var(--on-accent); padding: 0 20px; }
.btn-primary:hover { background: var(--ink); color: var(--page); }
.btn-secondary { border-color: var(--ink); color: var(--ink); }
.btn-secondary:hover { background: var(--fill); }
.btn-quiet { color: var(--ink); padding: 0 var(--s-3); }
.btn-quiet:hover:not(:disabled) { background: var(--fill); }
.btn-small { height: 32px; padding: 0 var(--s-3); font-size: var(--text-small); }
.btn-danger { color: var(--bad); border-color: var(--bad); }
.btn-danger:hover { background: var(--bad-fill); }

/* ---- form fields ---- */
.field { display: flex; flex-direction: column; gap: var(--s-1); margin-bottom: var(--s-3); }
.field > label, .field-label { font-size: var(--text-caption); color: var(--ink-3); }
.input, .select, .textarea {
  width: 100%; min-height: var(--control-h); padding: 0 var(--s-4); background: transparent;
  border: 1px solid var(--line-strong); border-radius: var(--r-input); color: var(--ink);
  transition: border-color var(--ease);
}
.textarea { padding: var(--s-3) var(--s-4); font-family: var(--mono); font-size: var(--text-small); resize: vertical; min-height: 200px; }
.input[aria-invalid="true"] { border-color: var(--bad); }
.field-error { font-size: var(--text-caption); color: var(--bad); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3); }
.check { display: flex; align-items: center; gap: var(--s-2); min-height: 32px; color: var(--ink); cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--ink); }

/* ---- layout ---- */
.layout { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 360px; min-height: 0; }
.workspace { min-width: 0; padding: var(--s-4) var(--s-5) var(--s-5); display: flex; flex-direction: column; gap: var(--s-3); }
.hint { margin: 0; font-size: var(--text-caption); line-height: var(--leading-caption); color: var(--ink-3); max-width: 90ch; }
.canvas-scroll {
  flex: 1; min-height: 360px; overflow: auto; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--r-card);
}
.stage-wrap { overflow: hidden; }
.stage { position: relative; transform-origin: 0 0; padding: var(--s-5); }
.stage .diagram { width: var(--figure-w, 1072px); }
.overlay { position: absolute; left: 0; top: 0; overflow: visible; touch-action: none; cursor: default; }
.overlay:focus-visible { outline: none; }
.inspector {
  border-left: 1px solid var(--line); background: var(--surface); padding: var(--s-5);
  overflow-y: auto; max-height: calc(100vh - 69px); position: sticky; top: 0;
}
@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .inspector { border-left: 0; border-top: 1px solid var(--line); max-height: none; position: static; }
  .bar { padding: var(--s-3) var(--s-4); }
  .workspace { padding: var(--s-4); }
}

/* ---- overlay marks (drawn in diagram units) ---- */
.ov-cell { fill: transparent; stroke: var(--line-strong); stroke-dasharray: 3 5; }
.ov-cell.free:hover, .ov-cell.hover { fill: var(--fill); }
.ov-plus { fill: var(--ink-3); pointer-events: none; }
.ov-cursor { fill: none; stroke: var(--ink); stroke-dasharray: 6 4; pointer-events: none; }
.ov-select { fill: none; stroke: var(--ink); pointer-events: none; }
.ov-hover { fill: none; stroke: var(--ink-3); pointer-events: none; }
.ov-edge-select { fill: none; stroke: var(--ink); stroke-linejoin: round; pointer-events: none; }
.ov-ghost { fill: var(--fill); fill-opacity: 0.6; stroke: var(--ink); stroke-dasharray: 6 4; pointer-events: none; }
.ov-ghost.invalid { fill: var(--bad-fill); stroke: var(--bad); }
.ov-link { fill: none; stroke: var(--ink-2); stroke-dasharray: 6 5; pointer-events: none; }
.ov-target { fill: none; stroke: var(--ink); pointer-events: none; }
.ov-handle { fill: var(--surface); stroke: var(--ink); cursor: crosshair; }
.ov-handle:hover { fill: var(--accent); }

/* ---- lint ---- */
.lint { font-size: var(--text-small); }
.lint-ok { color: var(--ink-3); margin: 0; }
.lint-list { margin: 0; padding: var(--s-3) var(--s-4); list-style: none; background: var(--bad-fill); border: 1px solid var(--bad); border-radius: var(--r-input); color: var(--ink); }
.lint-list li + li { margin-top: var(--s-1); }

/* ---- misc ---- */
.sr-status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.toast {
  position: fixed; bottom: var(--s-5); left: 50%; transform: translateX(-50%);
  background: var(--inverse); color: var(--on-inverse); padding: var(--s-3) var(--s-4); border-radius: var(--r-input);
  font-size: var(--text-small); max-width: min(560px, calc(100vw - 32px));
}

/* panels.css — the inspector panels (src/inspector.js) and the import dialog (src/io.js). Tokens only. */

.inspector h2 { font-size: var(--text-subheading); line-height: var(--leading-subheading); margin: 0 0 var(--s-3); }
.inspector .insp-back { margin: 0 0 var(--s-4); }
.inspector .check { margin-bottom: var(--s-3); }
.inspector .btn-danger { margin-top: var(--s-5); width: 100%; }

.insp-section { margin-bottom: var(--s-4); }
.insp-action { margin-top: var(--s-2); }

.insp-list { display: flex; flex-direction: column; gap: var(--s-1); margin-bottom: var(--s-1); }
.insp-list .btn { width: 100%; text-align: left; justify-content: flex-start; }

.insp-children { display: flex; flex-direction: column; gap: var(--s-2); margin-bottom: var(--s-1); }
.insp-child-row { display: flex; align-items: center; gap: var(--s-2); }
.insp-child-row .input { flex: 1; min-width: 0; }
.insp-child-row .select { width: auto; flex: none; padding-right: var(--s-2); }
.insp-child-row .btn { flex: none; width: 32px; padding: 0; font-size: var(--text-subheading); }

/* ---- import dialog ---- */
.import-dialog {
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-card);
  padding: var(--s-5); width: min(640px, 100vw - 32px);
}
.import-dialog::backdrop { background: color-mix(in srgb, var(--inverse) 55%, transparent); }
.import-dialog h2 { margin: 0 0 var(--s-3); }
.import-dialog .field { margin-bottom: var(--s-4); }
.import-dialog .import-note { font-size: var(--text-caption); color: var(--ink-3); margin: calc(-1 * var(--s-3)) 0 var(--s-4); }
.import-dialog .field-error { margin-bottom: var(--s-4); }
.import-dialog .import-actions { display: flex; justify-content: flex-end; gap: var(--s-2); }

</style>
</head>
<body>
<header class="bar">
  <h1 class="app-name">Diagram Studio</h1>
  <div class="bar-group" role="group" aria-label="History">
    <button type="button" class="btn btn-quiet" id="undo" title="Undo (⌘Z)">Undo</button>
    <button type="button" class="btn btn-quiet" id="redo" title="Redo (⇧⌘Z)">Redo</button>
    <button type="button" class="btn btn-quiet" id="clear" title="Remove every node, edge and zone (undoable)">Clear</button>
  </div>
  <div class="bar-group" role="group" aria-label="Zoom">
    <button type="button" class="btn btn-quiet" id="zoom-out" aria-label="Zoom out">−</button>
    <output id="zoom-level" class="zoom-level" aria-live="polite">100%</output>
    <button type="button" class="btn btn-quiet" id="zoom-in" aria-label="Zoom in">+</button>
    <button type="button" class="btn btn-quiet" id="zoom-fit">Fit</button>
  </div>
  <div class="bar-spacer"></div>
  <div class="bar-group" role="group" aria-label="Import and export">
    <button type="button" class="btn btn-secondary" id="import">Import</button>
    <button type="button" class="btn btn-secondary" id="copy-json">Copy spec JSON</button>
    <button type="button" class="btn btn-secondary" id="copy-figure">Copy &lt;figure&gt;</button>
    <button type="button" class="btn btn-primary" id="download-html">Download HTML</button>
  </div>
  <button type="button" class="btn btn-quiet" id="theme" aria-label="Theme: follows system">Theme: system</button>
</header>

<main class="layout">
  <section class="workspace" aria-label="Canvas">
    <p class="hint" id="hint">Click an empty cell to add a node. Drag a node to move it; drag its round handle onto another node to connect. Arrow keys move the cell cursor, Enter adds or selects, C connects, Delete removes.</p>
    <div class="canvas-scroll" id="canvas-scroll">
      <div class="stage-wrap" id="stage-wrap">
        <div class="stage" id="stage">
          <figure class="diagram" id="figure" data-scale="doc"><script type="application/json">{"nodes":[]}</script></figure>
          <svg class="overlay" id="overlay" tabindex="0" role="application" aria-label="Diagram grid. Arrow keys move the cell cursor; Enter adds or selects; C starts a connection; Delete removes the selection." aria-describedby="cursor-status"></svg>
        </div>
      </div>
    </div>
    <p class="sr-status" id="cursor-status" aria-live="polite"></p>
    <section class="lint" id="lint" aria-live="polite" aria-label="Lint"></section>
  </section>
  <aside class="inspector" id="inspector" aria-label="Inspector"></aside>
</main>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script id="dg-engine">
/* diagram.js — declarative grid diagrams that cannot overlap. Dependency-free; inline it verbatim.
 *
 * Why: hand-placed SVG coordinates produce labels on top of node text and edges through boxes.
 * Here you declare WHAT (nodes on a grid, edges, zones) and the layout is computed:
 *   - nodes sit in grid cells (they may span columns), so they never overlap;
 *   - edges run only through the gutters between rows and columns, so they never cross a node;
 *   - zones get a two-line header (name + one-sentence caption) in space reserved for it;
 *   - labels wrap to two lines, sit on their edge with a halo, and size the column gaps;
 *   - node text wraps, then shrinks, and the lint says so if it had to.
 *
 * Usage (this file is inlined into HTML, so it must never contain a literal closing script tag — hence "[script]"):
 *   <figure class="diagram" data-scale="doc">            "doc" for documents, "slide" for 1920x1080 decks
 *     [script type="application/json"]{
 *       "title": "Purchase path",
 *       "nodes": [
 *         {"id":"wr",  "label":"Waiting room", "sub":"random draw, then FIFO", "col":2, "row":0, "kind":"key"},
 *         {"id":"pg",  "label":"Postgres", "sub":"seats · holds · orders", "col":3, "row":2, "kind":"db"},
 *         {"id":"core","label":"Ticketing core", "sub":"modular monolith", "col":1, "row":2, "colspan":2,
 *          "children":[{"label":"Catalog"},{"label":"Inventory & holds","kind":"key"},{"label":"Orders"},{"label":"Checkout"}]}
 *       ],
 *       "edges": [ {"from":"core","to":"pg","label":"atomic UPDATE"}, {"from":"ctl","to":"wr","label":"release rate","hot":true} ],
 *       "groups":[ {"label":"Demand zone","caption":"2M sessions · ~100k req/s","rows":[0,0],"cols":[0,3]} ],
 *       "interactive": true                              nodes focusable; fires "diagram:select" {detail: node}
 *     }[/script]
 *   </figure>
 * node.kind   "default" | "hot" (accent fill — at most ONE) | "key" (ink outline: on the highlighted path) | "db" (cylinder)
 *             | "store" (pill) | "ext" (dashed: outside our system) | "term" (pill, muted) | "bad" | "muted"
 * node        colspan (span columns), children (a container: title top-left, child boxes in a row inside)
 * edge        label, dash, hot (the ONE highlighted path: heavier, ink in light / accent in dark),
 *             via "top"|"bottom"|"left"|"right" (which gutter a long edge uses), step
 * step        on a node / edge / group: adds class "step" + data-step so a slide deck reveals it as a build.
 * Lint        console.warn, figure[data-dg-issues], and a list under the figure when the URL has ?lint. Fix the SPEC, not the engine.
 * Geometry    after render, figure.dgLayout holds the computed layout in SVG units (read-only; for editors):
 *             {scale, viewBox, cols, rows, gx, gy, colW, cellH, colX[], rowTop[], rowH[], gutTop[], gutH[], nodes{id:{x,y,w,h,row,col,colspan}},
 *              edges[{from,to,points}], groups[{x,y,w,h}], labels[{x,y,w,h,text}], issues[]}
 */
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var SCALES = {
    doc:   { w: 200, h: 72,  gx: 76,  gy: 56,  t: 15, s: 13, l: 12.5, pad: 14, r: 10, lane: 9,  port: 14, halo: 5,  stroke: 1.5 },
    slide: { w: 400, h: 146, gx: 120, gy: 104, t: 34, s: 27, l: 25,   pad: 26, r: 16, lane: 18, port: 30, halo: 10, stroke: 3 }
  };
  var CSS = '.diagram{margin:0;overflow-x:auto}.diagram svg{display:block;height:auto}' +
    '.dg{--dg-hot:light-dark(var(--ink),var(--accent))}.dg text{font-family:var(--sans,system-ui,sans-serif);font-weight:400}' +
    '.dg-shape{fill:var(--surface);stroke:var(--line-strong);transition:stroke .3s ease-out}.dg-rim{fill:none;stroke:var(--line-strong)}' +
    '.dg-title{fill:var(--ink)}.dg-sub{fill:var(--ink-3)}' +
    '.dg-node.hot>.dg-shape,.dg-child.hot>.dg-shape{fill:var(--accent);stroke:var(--accent)}.dg-node.hot>text,.dg-child.hot>text{fill:var(--on-accent)}' +
    '.dg-node.key>.dg-shape,.dg-node.key>.dg-rim,.dg-child.key>.dg-shape{stroke:var(--dg-hot)}' +
    '.dg-node.ext>.dg-shape{fill:var(--fill);stroke-dasharray:6 5}.dg-node.term>.dg-shape,.dg-node.muted>.dg-shape{fill:var(--fill)}' +
    '.dg-node.box>.dg-shape{fill:var(--fill)}.dg-node.bad>.dg-shape{fill:var(--bad-fill);stroke:var(--bad)}.dg-node.muted>text{fill:var(--ink-3)}' +
    '.dg-node[tabindex]{cursor:pointer;outline:none}.dg-node[tabindex]:hover>.dg-shape,.dg-node[tabindex]:focus-visible>.dg-shape,.dg-node.active>.dg-shape{stroke:var(--ink)}' +
    '.dg-edge{fill:none;stroke:var(--ink-3)}.dg-edge.dash{stroke-dasharray:6 6}.dg-edge.hot{stroke:var(--dg-hot)}' +
    '.dg-arrow{fill:var(--ink-3)}.dg-arrow.hot{fill:var(--dg-hot)}' +
    '.dg-label{fill:var(--ink-2);paint-order:stroke;stroke:var(--dg-bg,var(--surface));stroke-linejoin:round}.dg-label.in-group{stroke:var(--fill)}.dg-label.hot{fill:var(--dg-hot)}' +
    '.dg-group rect{fill:var(--fill);stroke:var(--line);stroke-dasharray:3 6}' +
    '.dg-gtitle{fill:var(--ink)}.dg-gcap{fill:var(--ink-3)}.dg-gtitle,.dg-gcap{paint-order:stroke;stroke:var(--fill);stroke-linejoin:round}' +
    '.dg-lint{font:13px/1.5 var(--mono,monospace);color:var(--bad);margin-top:8px;white-space:pre-wrap}';

  function el(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) if (attrs[k] !== undefined && attrs[k] !== null) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function hit(a, b, pad) { pad = pad || 0; return a.x < b.x + b.w + pad && a.x + a.w + pad > b.x && a.y < b.y + b.h + pad && a.y + a.h + pad > b.y; }
  function split2(text, minLen) {                                   // break at the space nearest the middle
    if (text.indexOf(' ') < 0 || text.length < (minLen || 0)) return [text];
    var w = text.split(' '), bi = 1, bd = 1e9;
    for (var i = 1; i < w.length; i++) { var d = Math.abs(w.slice(0, i).join(' ').length - text.length / 2); if (d < bd) { bd = d; bi = i; } }
    return [w.slice(0, bi).join(' '), w.slice(bi).join(' ')];
  }

  function render(fig) {
    var src = fig.querySelector('script[type="application/json"]');
    if (!src) return;
    var spec; try { spec = JSON.parse(src.textContent); } catch (err) { fig.textContent = 'diagram: invalid JSON — ' + err.message; return; }
    var scaleName = spec.scale || fig.dataset.scale || 'doc', S = SCALES[scaleName] || SCALES.doc, issues = [];
    var old = fig.querySelector('svg'); if (old) old.remove();
    var oldLint = fig.querySelector('.dg-lint'); if (oldLint) oldLint.remove();
    var svg = el('svg', { 'class': 'dg', role: 'img', 'aria-label': spec.title || 'Diagram' }, fig);
    el('title', {}, svg).textContent = spec.title || 'Diagram';
    var defs = el('defs', {}, svg), uid = 'dg' + Math.random().toString(36).slice(2, 8);
    ['', 'hot'].forEach(function (k) {
      var ms = k ? 4.6 : 7;                                         // markers scale with stroke width; the hot stroke is heavier
      var m = el('marker', { id: uid + k, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: ms, markerHeight: ms, orient: 'auto-start-reverse' }, defs);
      el('path', { d: 'M0,0 L10,5 L0,10 z', 'class': 'dg-arrow ' + k }, m);
    });
    function measure(text, size) { var t = el('text', { 'font-size': size, x: -9999, y: -9999 }, svg); t.textContent = text; var w = t.getComputedTextLength(); t.remove(); return w; }

    var nodes = spec.nodes || [], edges = spec.edges || [], groups = spec.groups || [], byId = {};
    var rows = 0, cols = 0, cells = {};
    nodes.forEach(function (n) {
      byId[n.id] = n; n._c0 = n.col; n._c1 = n.col + (n.colspan || 1) - 1;

    fromWrap.appendChild(fromSelect);
    root.appendChild(fromWrap);
    regField(fromSelect, function () { return e.from; }, 'select');

    var toWrap = fieldWrap('To', 'f-to');
    var toSelect = ce('select', { 'class': 'select', id: 'f-to' });
    nodeOptionsInto(toSelect, e.to);
    toSelect.addEventListener('change', function () { commitEndpoint('to', toSelect); });
    toWrap.appendChild(toSelect);
    root.appendChild(toWrap);
    root.appendChild(endpointErr);
    regField(toSelect, function () { return e.to; }, 'select');

    var labelWrap = fieldWrap('Label', 'f-elabel');
    var labelInput = ce('input', { 'class': 'input', id: 'f-elabel', type: 'text' });
    labelInput.value = e.label || '';
    labelInput.addEventListener('input', function () { store.update(function () { store.setField(e, 'label', labelInput.value); }, 'edge:' + index + ':label'); });
    labelWrap.appendChild(labelInput);
    root.appendChild(labelWrap);
    regField(labelInput, function () { return e.label || ''; }, 'text');

    var dashLabel = ce('label', { 'class': 'check', 'for': 'f-dash' });
    var dashInput = ce('input', { type: 'checkbox', id: 'f-dash' });
    dashInput.checked = !!e.dash;
    dashInput.addEventListener('change', function () { store.update(function () { store.setField(e, 'dash', dashInput.checked); }); });
    dashLabel.appendChild(dashInput); dashLabel.appendChild(document.createTextNode('Dashed'));
    root.appendChild(dashLabel);
    regField(dashInput, function () { return !!e.dash; }, 'checkbox');

    var hotLabel = ce('label', { 'class': 'check', 'for': 'f-hot' });
    var hotInput = ce('input', { type: 'checkbox', id: 'f-hot' });
    hotInput.checked = !!e.hot;
    hotInput.addEventListener('change', function () { store.update(function () { store.setField(e, 'hot', hotInput.checked); }); });
    hotLabel.appendChild(hotInput); hotLabel.appendChild(document.createTextNode('Highlighted path'));
    root.appendChild(hotLabel);
    regField(hotInput, function () { return !!e.hot; }, 'checkbox');

    var viaWrap = fieldWrap('Via', 'f-via');
    var viaSelect = ce('select', { 'class': 'select', id: 'f-via' });
    viaSelect.appendChild(ce('option', { value: '', text: 'Auto' }));
    store.VIAS.forEach(function (v) { viaSelect.appendChild(ce('option', { value: v, text: v })); });
    viaSelect.value = e.via || '';
    viaSelect.addEventListener('change', function () { store.update(function () { store.setField(e, 'via', viaSelect.value); }); });
    viaWrap.appendChild(viaSelect);
    root.appendChild(viaWrap);
    regField(viaSelect, function () { return e.via || ''; }, 'select');

    buildStep(root, e);

    var reverseBtn = ce('button', { type: 'button', 'class': 'btn btn-secondary btn-small insp-action', text: 'Reverse direction' });
    reverseBtn.addEventListener('click', function () { store.update(function () { var t = e.from; e.from = e.to; e.to = t; }); });
    root.appendChild(reverseBtn);

    var delBtn = ce('button', { type: 'button', 'class': 'btn btn-danger', text: 'Delete edge' });
    delBtn.addEventListener('click', function () { store.ops.deleteEdge(index); });
    root.appendChild(delBtn);
  }

  function renderGroup(g, index) {
    root.appendChild(h2('Zone'));
    root.appendChild(backButton());

    var labelWrap = fieldWrap('Label', 'f-glabel');
    var labelInput = ce('input', { 'class': 'input', id: 'f-glabel', type: 'text' });
    labelInput.value = g.label || '';
    labelInput.addEventListener('input', function () { store.update(function () { store.setField(g, 'label', labelInput.value); }, 'group:' + index + ':label'); });
    labelWrap.appendChild(labelInput);
    root.appendChild(labelWrap);
    regField(labelInput, function () { return g.label || ''; }, 'text');

    var capWrap = fieldWrap('Caption', 'f-gcaption');
    var capInput = ce('input', { 'class': 'input', id: 'f-gcaption', type: 'text' });
    capInput.value = g.caption || '';
    capInput.addEventListener('input', function () { store.update(function () { store.setField(g, 'caption', capInput.value); }, 'group:' + index + ':caption'); });
    capWrap.appendChild(capInput);
    root.appendChild(capWrap);
    regField(capInput, function () { return g.caption || ''; }, 'text');

    var gridErr = errEl('f-grid-err');
    function buildRange(labelText, idPrefix, key) {
      var row = ce('div', { 'class': 'field-row' });
      var firstWrap = fieldWrap(labelText + ' first', idPrefix + '-first'), lastWrap = fieldWrap(labelText + ' last', idPrefix + '-last');
      var firstInput = ce('input', { 'class': 'input', id: idPrefix + '-first', type: 'number', min: '0' });
      var lastInput = ce('input', { 'class': 'input', id: idPrefix + '-last', type: 'number', min: '0' });
      firstInput.value = g[key][0]; lastInput.value = g[key][1];
      function commit() {
        var first = parseInt(firstInput.value, 10), last = parseInt(lastInput.value, 10);
        if (isNaN(first) || isNaN(last) || first < 0 || last < first) {
          showError(gridErr, labelText + ' must satisfy 0 ≤ first ≤ last');
          markInvalid(firstInput, true); markInvalid(lastInput, true);
          firstInput.value = g[key][0]; lastInput.value = g[key][1];
          return;
        }
        showError(gridErr, null); markInvalid(firstInput, false); markInvalid(lastInput, false);
        store.update(function () { g[key] = [first, last]; });
      }
      firstInput.addEventListener('change', commit); lastInput.addEventListener('change', commit);
      firstWrap.appendChild(firstInput); lastWrap.appendChild(lastInput);
      row.appendChild(firstWrap); row.appendChild(lastWrap);
      root.appendChild(row);
      regField(firstInput, function () { return g[key][0]; }, 'text');
      regField(lastInput, function () { return g[key][1]; }, 'text');
    }
    buildRange('Rows', 'f-rows', 'rows');
    buildRange('Cols', 'f-cols', 'cols');
    root.appendChild(gridErr);

    buildStep(root, g);

    var delBtn = ce('button', { type: 'button', 'class': 'btn btn-danger', text: 'Delete zone' });
    delBtn.addEventListener('click', function () { store.ops.deleteGroup(index); });
    root.appendChild(delBtn);
  }

  // ==================================================== sync / rebuild ====================================================

  function signature(sel) {
    if (!sel) { var s = store.get(); return 'none:' + s.nodes.length + ':' + (s.edges || []).length + ':' + (s.groups || []).length; }
    if (sel.type === 'node') { var n = store.node(sel.id); return n ? 'node:' + sel.id + ':' + (n.children ? n.children.length : 0) : null; }
    if (sel.type === 'edge') { return (store.get().edges || [])[sel.index] ? 'edge:' + sel.index : null; }
    if (sel.type === 'group') { return (store.get().groups || [])[sel.index] ? 'group:' + sel.index : null; }
    return 'none';
  }

  function rebuild() {
    registry = [];
    while (root.firstChild) root.removeChild(root.firstChild);
    var sel = store.selection();
    if (sel && sel.type === 'node' && store.node(sel.id)) renderNode(store.node(sel.id));
    else if (sel && sel.type === 'edge' && (store.get().edges || [])[sel.index]) renderEdge(store.get().edges[sel.index], sel.index);
    else if (sel && sel.type === 'group' && (store.get().groups || [])[sel.index]) renderGroup(store.get().groups[sel.index], sel.index);
    else renderDiagram();
    lastSig = signature(store.selection());
  }

  function refreshInPlace() {
    registry.forEach(function (r) {
      if (r.el === document.activeElement) return;
      if (r.kind === 'checkbox') { var b = !!r.get(); if (r.el.checked !== b) r.el.checked = b; }
      else { var v = r.get(); var sv = (v === undefined || v === null) ? '' : String(v); if (r.el.value !== sv) r.el.value = sv; }
    });
  }

  function sync(reason) {
    var sig = signature(store.selection());
    if (reason === 'spec' && sig !== null && sig === lastSig) { refreshInPlace(); return; }
    rebuild();
  }

  function focusField(name) {
    var el = root.querySelector('#f-' + name);
    if (!el) return;
    el.focus();
    if (el.select) el.select();
  }

  function init(opts) { store = opts.store; root = opts.root; lastSig = undefined; }

  Studio.inspector = { init: init, sync: sync, focusField: focusField };
})();

/* io.js — import/export: the toolbar's Import, Copy spec JSON, Copy figure and Download HTML buttons.
 *
 * Export never touches the DOM figure; it reads the store directly, so what you copy or download is exactly
 * what is in the spec. Import is permissive about what you paste (raw JSON, a <figure> block, or a whole
 * HTML page) but strict about what it hands to the store: store.replace() does the real validation and
 * import stays a no-op (dialog stays open, errors listed) until the spec is actually usable.
 */
(function () {
  'use strict';
  var Studio = window.Studio = window.Studio || {};
  var store, importEls, exportEls;
  var $ = function (id) { return document.getElementById(id); };

  function escapeHTML(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function slugify(s) {
    return ((s || 'diagram').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '')) || 'diagram';
  }

  // ---- export ----
  function specJSON() { return JSON.stringify(store.get(), null, 2); }

  function figureHTML() {
    var scale = store.scale();
    var json = JSON.stringify(store.get(), null, 2).replace(/<\//g, '<\\/');   // never a literal closing tag inside the script element
    return '<figure class="diagram" data-scale="' + scale + '">\n<script type="application/json">' + json + '<' + '/script>\n</figure>';
  }

  function standaloneHTML() {
    var spec = store.get();
    var tokens = ($('tokens') && $('tokens').textContent) || '';
    var engine = ($('dg-engine') && $('dg-engine').textContent) || '';
    var pageCss = 'body{margin:0;background:var(--page);color:var(--ink-2);' +
      'font:var(--weight) var(--text-body)/var(--leading-body) var(--sans)}' +
      '.page-col{max-width:1120px;margin:0 auto;padding:24px}' +
      '.diagram-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px}';
    return '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
      '<title>' + escapeHTML(spec.title || 'Diagram') + '</title>\n' +
      '<style>\n' + tokens + '\n' + pageCss + '\n' + '<' + '/style>\n' +
      '</head>\n<body>\n<div class="page-col"><div class="diagram-card">\n' + figureHTML() + '\n</div></div>\n' +
      '<script>\n' + engine + '\n' + '<' + '/script>\n' +
      '</body>\n</html>\n';
  }

  // ---- import ----
  function parseImport(text) {
    text = (text || '').trim();
    if (!text) throw new Error('paste a spec JSON, a <figure> block, or a whole HTML page');
    if (text.charAt(0) === '{') {
      try { return { spec: JSON.parse(text), scale: undefined }; }
      catch (e) { throw new Error('that does not look like a <figure> block, and it is not valid JSON: ' + e.message); }
    }
    var doc = new DOMParser().parseFromString(text, 'text/html');
    var fig = doc.querySelector('figure.diagram');
    if (!fig) throw new Error('no spec JSON and no <figure class="diagram"> block found in the pasted text');
    var script = fig.querySelector('script[type="application/json"]');
    if (!script) throw new Error('the <figure> has no script[type="application/json"] with the spec');
    var spec;
    try { spec = JSON.parse(script.textContent); }
    catch (e2) { throw new Error("the figure's JSON is invalid: " + e2.message); }
    var scaleAttr = fig.getAttribute('data-scale');
    return { spec: spec, scale: (scaleAttr === 'doc' || scaleAttr === 'slide') ? scaleAttr : undefined };
  }

  function buildImportDialog() {
    var dialog = document.createElement('dialog');
    dialog.className = 'import-dialog';
    dialog.appendChild(elText('h2', 'Import'));
    dialog.appendChild(elText('p', 'Paste a spec JSON, a <figure> block, or a whole HTML page. The scale ("doc" or "slide") is read from a pasted figure’s data-scale, or from spec.scale, when present.', 'import-note'));

    var wrap = document.createElement('div'); wrap.className = 'field';
    var lab = document.createElement('label'); lab.setAttribute('for', 'import-text'); lab.textContent = 'Spec, figure, or page';
    var ta = document.createElement('textarea'); ta.className = 'textarea'; ta.id = 'import-text';
    wrap.appendChild(lab); wrap.appendChild(ta);
    dialog.appendChild(wrap);

    var errBox = document.createElement('div'); errBox.className = 'field-error'; errBox.hidden = true;
    dialog.appendChild(errBox);

    var actions = document.createElement('div'); actions.className = 'import-actions';
    var cancelBtn = document.createElement('button'); cancelBtn.type = 'button'; cancelBtn.className = 'btn btn-secondary'; cancelBtn.textContent = 'Cancel';
    cancelBtn.addEventListener('click', function () { dialog.close(); });
    var importBtn = document.createElement('button'); importBtn.type = 'button'; importBtn.className = 'btn btn-primary'; importBtn.textContent = 'Import';
    importBtn.addEventListener('click', doImport);
    actions.appendChild(cancelBtn); actions.appendChild(importBtn);
    dialog.appendChild(actions);

    dialog.addEventListener('close', function () { errBox.hidden = true; errBox.textContent = ''; });
    document.body.appendChild(dialog);
    return { dialog: dialog, textarea: ta, errBox: errBox };
  }

  function elText(tag, text, cls) {
    var e = document.createElement(tag);
    e.textContent = text;
    if (cls) e.className = cls;
    return e;
  }

  function showImportProblems(list) {
    var box = importEls.errBox;
    while (box.firstChild) box.removeChild(box.firstChild);
    var ul = document.createElement('ul');
    list.forEach(function (msg) { ul.appendChild(elText('li', msg)); });
    box.appendChild(ul);
    box.hidden = false;
  }

  function doImport() {
    var parsed;
    try { parsed = parseImport(importEls.textarea.value); }
    catch (e) { showImportProblems([e.message]); return; }
    try { store.replace(parsed.spec, parsed.scale); }
    catch (e2) { showImportProblems(e2.problems || [e2.message]); return; }
    importEls.dialog.close();
    Studio.toast('Imported ' + store.get().nodes.length + ' nodes');
  }

  // ---- clipboard, with a manual fallback when it is blocked (common on file://) ----
  function buildExportDialog() {
    var dialog = document.createElement('dialog');
    dialog.className = 'import-dialog';
    dialog.appendChild(elText('h2', 'Copy manually'));
    dialog.appendChild(elText('p', 'Clipboard access is blocked here (common when the page is opened from a file:// URL). Select the text below and copy it yourself.', 'import-note'));
    var wrap = document.createElement('div'); wrap.className = 'field';
    var lab = document.createElement('label'); lab.setAttribute('for', 'export-text'); lab.textContent = 'Content';
    var ta = document.createElement('textarea'); ta.className = 'textarea'; ta.id = 'export-text'; ta.readOnly = true;
    wrap.appendChild(lab); wrap.appendChild(ta);
    dialog.appendChild(wrap);
    var actions = document.createElement('div'); actions.className = 'import-actions';
    var closeBtn = document.createElement('button'); closeBtn.type = 'button'; closeBtn.className = 'btn btn-primary'; closeBtn.textContent = 'Close';
    closeBtn.addEventListener('click', function () { dialog.close(); });
    actions.appendChild(closeBtn);
    dialog.appendChild(actions);
    document.body.appendChild(dialog);
    return { dialog: dialog, textarea: ta };
  }

  function openExportFallback(text) {
    exportEls.textarea.value = text;
    exportEls.dialog.showModal();
    exportEls.textarea.focus(); exportEls.textarea.select();
  }

  function copyText(text, successMsg) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { Studio.toast(successMsg); }, function () { openExportFallback(text); });
    } else { openExportFallback(text); }
  }

  // ---- download ----
  function downloadHTML() {
    var html = standaloneHTML();
    var blob = new Blob([html], { type: 'text/html' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = slugify(store.get().title) + '.html';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    Studio.toast('Downloaded ' + a.download);
    setTimeout(function () { URL.revokeObjectURL(url); }, 10000);           // revoking immediately can cancel the download in some browsers
  }

  function init(opts) {
    store = opts.store;
    importEls = buildImportDialog();
    exportEls = buildExportDialog();
    $('import').addEventListener('click', function () {
      importEls.errBox.hidden = true; importEls.errBox.textContent = '';
      importEls.textarea.value = '';
      importEls.dialog.showModal();
      importEls.textarea.focus();
    });
    $('copy-json').addEventListener('click', function () { copyText(specJSON(), 'Copied spec JSON'); });
    $('copy-figure').addEventListener('click', function () { copyText(figureHTML(), 'Copied <figure> block'); });
    $('download-html').addEventListener('click', downloadHTML);
  }

  Studio.io = { init: init, figureHTML: figureHTML, standaloneHTML: standaloneHTML, specJSON: specJSON, parseImport: parseImport };
})();

/* main.js — wires store, canvas, inspector and io together; owns the toolbar, theme, lint panel and global keys. */
(function () {
  'use strict';
  var Studio = window.Studio;
  var THEME_KEY = 'diagram-studio:theme', THEMES = ['system', 'light', 'dark'];
  var STARTER = {
    title: 'Checkout path',
    nodes: [
      { id: 'user', label: 'Shopper', col: 0, row: 0, kind: 'term' },
      { id: 'api', label: 'API gateway', sub: 'auth · rate limits', col: 1, row: 0, kind: 'key' },
      { id: 'orders', label: 'Orders service', sub: 'modular monolith', col: 2, row: 0, kind: 'hot' },
      { id: 'pg', label: 'Postgres', sub: 'orders · payments', col: 2, row: 1, kind: 'db' },
      { id: 'psp', label: 'Payment provider', col: 1, row: 1, kind: 'ext' }
    ],
    edges: [
      { from: 'user', to: 'api' },
      { from: 'api', to: 'orders', label: 'place order', hot: true },
      { from: 'orders', to: 'pg', label: 'one transaction' },
      { from: 'orders', to: 'psp', label: 'charge', dash: true }
    ],
    groups: [{ label: 'Our system', caption: 'one deploy, one database', rows: [0, 1], cols: [1, 2] }]
  };
  var $ = function (id) { return document.getElementById(id); };

  var toastTimer;
  Studio.toast = function (msg) {                                   // short confirmation or error, announced politely
    var t = $('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 3200);
  };

  function applyTheme(name) {
    if (name === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', name);
    var b = $('theme'); b.textContent = 'Theme: ' + name; b.setAttribute('aria-label', 'Theme: ' + (name === 'system' ? 'follows system' : name) + '. Change theme');
  }
  function initTheme() {
    var name = 'system';
    try { name = localStorage.getItem(THEME_KEY) || 'system'; } catch (e) { /* storage unavailable */ }
    if (THEMES.indexOf(name) < 0) name = 'system';
    applyTheme(name);
    $('theme').addEventListener('click', function () {
      name = THEMES[(THEMES.indexOf(name) + 1) % THEMES.length]; applyTheme(name);
      try { localStorage.setItem(THEME_KEY, name); } catch (e) { /* storage unavailable */ }
      Studio.canvas.render();                                        // label halos and measured text follow the theme
    });
  }

  function renderLint() {
    var issues = (Studio.canvas.layout() || {}).issues || [], box = $('lint');
    box.textContent = '';
    if (!issues.length) { var ok = document.createElement('p'); ok.className = 'lint-ok'; ok.textContent = 'Lint: no issues.'; box.appendChild(ok); return; }
    var ul = document.createElement('ul'); ul.className = 'lint-list';
    issues.forEach(function (s) { var li = document.createElement('li'); li.textContent = 'Problem: ' + s; ul.appendChild(li); });
    box.appendChild(ul);
  }
  function syncToolbar() {
    var s = Studio.store.get();
    $('undo').disabled = !Studio.store.canUndo(); $('redo').disabled = !Studio.store.canRedo();
    $('clear').disabled = !s.nodes.length && !(s.groups || []).length;
  }

  function isTyping(t) { return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable); }

  function start() {
    var store = Studio.store;
    Studio.canvas.init({ store: store, figure: $('figure'), overlay: $('overlay'), stage: $('stage'), wrap: $('stage-wrap'), scroller: $('canvas-scroll'), status: $('cursor-status') });
    Studio.inspector.init({ store: store, root: $('inspector') });
    Studio.io.init({ store: store });
    store.subscribe(function (reason) {
      if (reason === 'selection') Studio.canvas.redraw();
      else { Studio.canvas.render(); renderLint(); }
      Studio.inspector.sync(reason);
      syncToolbar();
    });
    initTheme();
    $('undo').addEventListener('click', store.undo);
    $('redo').addEventListener('click', store.redo);
    $('clear').addEventListener('click', function () {
      if (!store.get().nodes.length && !(store.get().groups || []).length) return;
      store.ops.clear(); Studio.toast('Cleared — Undo restores it');
    });
    $('zoom-in').addEventListener('click', Studio.canvas.zoomIn);
    $('zoom-out').addEventListener('click', Studio.canvas.zoomOut);
    $('zoom-fit').addEventListener('click', Studio.canvas.zoomFit);
    document.addEventListener('keydown', function (ev) {
      if (!(ev.metaKey || ev.ctrlKey) || isTyping(ev.target)) return;
      var k = ev.key.toLowerCase();
      if (k === 'z' && !ev.shiftKey) { ev.preventDefault(); store.undo(); }
      else if ((k === 'z' && ev.shiftKey) || k === 'y') { ev.preventDefault(); store.redo(); }
    });
    store.init(STARTER);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
